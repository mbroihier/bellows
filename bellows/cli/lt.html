<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <script>
      window.onload = function(){
	  document.getElementById('wjs').setAttribute('style', 'display: block');
	  document.getElementById('wojs').setAttribute('style', 'display: none');
	  let tocolor = function(T) {
	      const tempInMireds = [588, 555, 526, 500, 476, 454, 434, 416, 400, 384, 370, 357, 344,
				    333, 322, 312, 303, 294, 285, 277, 270, 263, 256, 250, 243, 238,
				    232, 227, 222, 217, 212, 208, 204, 200, 196, 192, 188, 185, 181,
				    178, 175, 172, 169, 166, 163, 161, 158, 156, 153, 151];
	      const color = ['#ff7900', '#ff7f00', '#ff8500', '#ff8b00', '#ff9020', '#ff952b', '#ff9a35',
			     '#ff9e3e', '#ffa247', '#ffa64f', '#ffaa57', '#ffae5e', '#ffb166', '#ffb46c',
			     '#ffb873', '#ffbb79', '#ffbe7f', '#ffc185', '#ffc38a', '#ffc690', '#ffc995',
			     '#ffcb9a', '#ffce9f', '#ffd0a4', '#ffd2a8', '#ffd4ad', '#ffd6b1', '#ffd9b5',
			     '#ffdbb9', '#ffddbe', '#ffdec2', '#ffe0c5', '#ffe2c9', '#ffe4cd', '#ffe6d1',
			     '#ffe7d4', '#ffe9d8', '#ffeadb', '#ffecdf', '#ffede2', '#ffefe6', '#fff0e9',
			     '#fff2ec', '#fff3ef', '#fff5f2', '#fff6f5', '#fff7f8', '#fff8fb', '#fffafe',
			     '#fff9ff'];
	      T = parseInt(T)
	      for (t in tempInMireds) {
		  //console.log("Testing: " + tempInMireds[t])
		  if (tempInMireds[t] < T) {
		      return color[t];
		  }
	      }
	  }
	  var slider = document.getElementById('slider')
	  slider.oninput = function() {
	      wssend('b0:c7:de:ff:fe:52:ca:58setCT '+this.value)
	  }
	  var levelSliderValue = document.getElementById('light-level');
	  var setNewLevel = document.getElementById('level-slider-value');
	  levelSliderValue.oninput = function () {
	      setNewLevel.textContent = this.value;
	      wssend('b0:c7:de:ff:fe:52:ca:58setLevel '+this.value)
	  }
	  var hueSliderValue = document.getElementById('hue-level');
	  var setNewHue = document.getElementById('hue-slider-value');
	  hueSliderValue.oninput = function () {
	      setNewHue.textContent = this.value;
	      wssend('b0:c7:de:ff:fe:52:ca:58setHue '+this.value)
	  }
	  var satSliderValue = document.getElementById('sat-level');
	  var setNewSat = document.getElementById('sat-slider-value');
	  satSliderValue.oninput = function () {
	      setNewSat.textContent = this.value;
	      wssend('b0:c7:de:ff:fe:52:ca:58setSat '+this.value)
	  }
	  var socket = null;
	  var initialMessage;
	  var oldStatusObject = null;
	  var equalCount = 0;
	  let start = function(message) {
	      initialMessage = message;
	      socket = new WebSocket("ws://192.168.1.224:8126");
	      
	      socket.onopen = function(e) {
		  console.log("ws connection made");
		  socket.send(initialMessage);
	      };
	      socket.onmessage = function(event) {
		  let statusObject = JSON.parse(event.data);
		  console.log(statusObject)
		  
		  for (device in statusObject) {
		      //console.log("working with " + device);
		      let targetElement = document.getElementById(device+'setCT 3000')
		      let T = 333
		      let c = '#000000'
		      if (targetElement != null) {
			  T = parseInt(statusObject[device+'CT'])
			  let max = Math.floor(1000000 / parseInt(statusObject[device+'minMireds'])/100+0.5)*100 - 100;
			  let min = Math.floor(1000000 / parseInt(statusObject[device+'maxMireds'])/100+0.5)*100 + 100;
			  c = tocolor(T)
			  console.log("Color Temperature (mireds): " + T)
			  console.log("Color: " + c)
			  console.log("min Color Temperature: " + min)
			  console.log("max Color Temperature: " + max)
			  T =  Math.floor(1000000 / T / 100 + 0.5) * 100
			  console.log("Color Temperature (Kelvin): " + T)
			  let sTarget = document.getElementById('lt-slider-value');
			  sTarget.textContent = T;
			  sTarget = document.getElementById('slider')
			  sTarget.value = T;
			  sTarget.setAttribute('min', min);
			  sTarget.setAttribute('max', max);
		      }
		      if (targetElement != null) {
			  targetElement.setAttribute('style', 'visibility: visible');
			  targetElement.setAttribute('style', 'color: '+c);
		      }
		      targetElement = document.getElementById(device+'setCT 3500')
		      if (targetElement != null) {
			  targetElement.setAttribute('style', 'visibility: visible');
			  targetElement.setAttribute('style', 'color: '+c);
		      }
		      targetElement = document.getElementById(device+'setCT 4000')
		      if (targetElement != null) {
			  targetElement.setAttribute('style', 'visibility: visible');
			  targetElement.setAttribute('style', 'color: '+c);
		      }
		      targetElement = document.getElementById(device+'setCT 4500')
		      if (targetElement != null) {
			  targetElement.setAttribute('style', 'visibility: visible');
			  targetElement.setAttribute('style', 'color: '+c);
		      }
		      targetElement = document.getElementById(device+'setCT 5000')
		      if (targetElement != null) {
			  targetElement.setAttribute('style', 'visibility: visible');
			  targetElement.setAttribute('style', 'color: '+c);
		      }
		      targetElement = document.getElementById(device+'setCT 5500')
		      if (targetElement != null) {
			  targetElement.setAttribute('style', 'visibility: visible');
			  targetElement.setAttribute('style', 'color: '+c);
		      }
		      targetElement = document.getElementById(device+'setCT 6000')
		      if (targetElement != null) {
			  targetElement.setAttribute('style', 'visibility: visible');
			  targetElement.setAttribute('style', 'color: '+c);
			  if (statusObject[device+"Level"] != null) {
			      let sliderRef = document.getElementById('light-level');
			      console.log("old level "+setNewLevel.textContent);
			      setNewLevel.textContent = statusObject[device+"Level"];
			      setNewHue.textContent = statusObject[device+"hue"];
			      hueSliderValue.value = statusObject[device+"hue"];
			      setNewSat.textContent = statusObject[device+"saturation"];
			      satSliderValue.value = statusObject[device+"saturation"];
			      sliderRef.value = statusObject[device+"Level"];
			      console.log("new level "+setNewLevel.textContent);
			      console.log("new slider value "+sliderRef.value);
			      if (oldStatusObject == null) {
				  oldStatusObject = structuredClone(statusObject);
				  equalCount = 0;
				  console.log('oldStatusObject was null and should now be set');
			      } else {
				  let objectsEqual = true;
				  console.log('checking each element of statusObject');
				  for (const [key, value] of Object.entries(oldStatusObject)) {
				      if (statusObject[key] != value) {
					  console.log('statusObject['+key+'] is not '+value);
					  equalCount = 0;
					  objectsEqual = false;
				      }
				  }
				  if (objectsEqual) {
				      equalCount++;
				  }
				  console.log("equalCount: "+equalCount);
				  oldStatusObject = structuredClone(statusObject);
			      }
			      if (equalCount < 5) {
				  socket.send(device+'readCT');
			      }
			  }
		      }
		  }
	      }
	      socket.onclose = function(e) {
		  console.log("didn't expect close");
		  socket = null;
	      }
	  }
	  start("http client connection request");
	  wssend = function(message) {
	      try {
		  console.log("sending " + message);
		  socket.send(message);
	      } catch (error) {
		  console.log("websocket send failed: " + error);
		  start(message);
	      }
	  }
      }
      </script>
    <title> Color Temperature </title>
  </head>
  <body>
    <style>
      div {
	  width: 100%;
	  height: 600px;
	  text-align: center;
      }
      ul {
	  list-style-type: none;
      }
      button {
	  width: 35%;
	  padding: 4px 4px;
	  border: 3px solid black;
	  margin: 2px 2px;
	  font-size: 50px;
	  border-radius: 10px;
	  background-color: black;
	  color: white;
      }
      .slider {
	  width: 35%;
      }
    </style>
    <h1> Color Temperature </h1>
    <ul>
      <div id="wjs" style="display: none">
	<li><button id="b0:c7:de:ff:fe:52:ca:58setCT 3000" style="visibility: hidden" onclick="wssend('b0:c7:de:ff:fe:52:ca:58setCT 3000')" >3000</button></li>
	<li><button id="b0:c7:de:ff:fe:52:ca:58setCT 3500" style="visibility: hidden" onclick="wssend('b0:c7:de:ff:fe:52:ca:58setCT 3500')" >3500</button></li>
	<li><button id="b0:c7:de:ff:fe:52:ca:58setCT 4000" style="visibility: hidden" onclick="wssend('b0:c7:de:ff:fe:52:ca:58setCT 4000')" >4000</button></li>
	<li><button id="b0:c7:de:ff:fe:52:ca:58setCT 4500" style="visibility: hidden" onclick="wssend('b0:c7:de:ff:fe:52:ca:58setCT 4500')" >4500</button></li>
	<li><button id="b0:c7:de:ff:fe:52:ca:58setCT 5000" style="visibility: hidden" onclick="wssend('b0:c7:de:ff:fe:52:ca:58setCT 5000')" >5000</button></li>
	<li><button id="b0:c7:de:ff:fe:52:ca:58setCT 5500" style="visibility: hidden" onclick="wssend('b0:c7:de:ff:fe:52:ca:58setCT 5500')" >5500</button></li>
	<li><button id="b0:c7:de:ff:fe:52:ca:58setCT 6000" style="visibility: hidden" onclick="wssend('b0:c7:de:ff:fe:52:ca:58setCT 6000')" >6000</button></li>
	<li>
	  <label for="lt-form">Light Temperature: <span id="lt-slider-value">5000</span></label>
	  <input class="slider" type="range" min="2000" max="8000" value="5000" id="slider">

	</li>
	<li>
	  <label for="level-form">Level: <span id="level-slider-value">128</span></label>
	  <input class="slider" type="range" id="light-level" min="0" max="256" value="128">
	</li>
	<li>
	  <label for="hue-form">Hue Level: <span id="hue-slider-value">128</span></label>
	  <input class="slider" type="range" id="hue-level" min="0" max="254" value="128">
	</li>
	<li>
	  <label for="sat-form">Saturation Level: <span id="sat-slider-value">128</span></label>
	  <input class="slider" type="range" id="sat-level" min="0" max="254" value="128">
	</li>
    </ul>
    </div>
    <ul>
      <div id="wojs" style="display: block">
	<form>
	  <li><button id="b0:c7:de:ff:fe:52:ca:58setCT 3000" style="visibility: visible" type="submit" formaction="/b0:c7:de:ff:fe:52:ca:58setCT 3000" formmethod="get">3000</button></li>
	  <li><button id="b0:c7:de:ff:fe:52:ca:58setCT 3500" style="visibility: visible" type="submit" formaction="/b0:c7:de:ff:fe:52:ca:58setCT 3500" formmethod="get">3500</button></li>
	  <li><button id="b0:c7:de:ff:fe:52:ca:58setCT 4000" style="visibility: visible" type="submit" formaction="/b0:c7:de:ff:fe:52:ca:58setCT 4000" formmethod="get">4000</button></li>
	  <li><button id="b0:c7:de:ff:fe:52:ca:58setCT 4500" style="visibility: visible" type="submit" formaction="/b0:c7:de:ff:fe:52:ca:58setCT 4500" formmethod="get">4500</button></li>
	  <li><button id="b0:c7:de:ff:fe:52:ca:58setCT 5000" style="visibility: visible" type="submit" formaction="/b0:c7:de:ff:fe:52:ca:58setCT 5000" formmethod="get">5000</button></li>
	  <li><button id="b0:c7:de:ff:fe:52:ca:58setCT 5500" style="visibility: visible" type="submit" formaction="/b0:c7:de:ff:fe:52:ca:58setCT 5500" formmethod="get">5500</button></li>
	  <li><button id="b0:c7:de:ff:fe:52:ca:58setCT 6000" style="visibility: visible" type="submit" formaction="/b0:c7:de:ff:fe:52:ca:58setCT 6000" formmethod="get">6000</button></li>
	</form>
      </div>
    </ul>
  </body>
</html>
